<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-animation"></div>

    <main class="container">
        <header>
            <h1>Nuestro Rincón de Amor <span class="heart">❤️</span></h1>
            <p>Sube nuestras mejores fotos y dime cuánto me quieres.</p>
            <h2>
                <span class="heart">❤️</span> Nicoll & Nicolás <span class="heart">❤️</span>
            </h2>
        </header>

        <section class="upload-section glass-panel">
            <form id="loveForm">
                <div class="file-input-wrapper">
                    <input type="file" id="photoInput" accept="image/*" required>
                    <label for="photoInput" class="file-label">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span id="fileName">Seleccionar Foto...</span>
                    </label>
                </div>

                <textarea id="messageInput" placeholder="Escribe tu mensaje de amor aquí..." required
                    rows="4"></textarea>

                <button type="submit" class="btn-submit">
                    Guardar Recuerdo
                </button>
            </form>
        </section>

        <section id="gallery" class="gallery">
            <!-- Los recuerdos se añadirán aquí dinámicamente -->
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
